[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "falseref"
version = "0.1.0"
description = "Flags references that do not exist or are cited wrongly, without an LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "pandas",
    "pymupdf",
    "rapidfuzz",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]
browser = ["playwright"]  # then: playwright install chromium
demo = ["ipykernel"]

[project.scripts]
falseref = "falseref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
